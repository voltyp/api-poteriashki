version: '3.7'
services:
  poteriashki_db:
    image: postgres:15.1
    container_name: poteriashki_db
    restart: always
    ports:
      - ${DB_PORT}:${DB_PORT}
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_NAME}
      PG_DATA: /var/lib/postgresql/data
    expose:
      - 5432
    env_file:
      - .env
    volumes:
      - ./poteriashki_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  poteriashki:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      poteriashki_db:
        condition: service_healthy
    container_name: poteriashki
    env_file:
      - .env
    environment:
      DB_HOST: poteriashki_db
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./static:/usr/src/app/static
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

